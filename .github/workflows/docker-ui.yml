name: Build & Push UI image

on:
  push:
    branches: [main]
    paths:
      - 'ui/**'
      - '.github/workflows/docker-ui.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push UI image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ui/Dockerfile
          push: true
          tags: |
            ghcr.io/0repeat-lab/dograh-ui:latest
            ghcr.io/0repeat-lab/dograh-ui:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
