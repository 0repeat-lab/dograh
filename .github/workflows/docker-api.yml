name: Build, Push & Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'pipecat/**'
      - 'docs/**'
      - '.github/workflows/docker-api.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve short SHA
        id: sha
        run: echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/0repeat-lab/dograh-api:latest
            ghcr.io/0repeat-lab/dograh-api:${{ github.sha }}
          cache-from: type=gha,scope=dograh-api
          cache-to: type=gha,mode=max,scope=dograh-api

      # Keep the package public so the VPS can pull without credentials.
      - name: Ensure package is public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method PATCH /user/packages/container/dograh-api -f visibility=public || true

      # Repoint the live compose at the immutable SHA tag and redeploy.
      # The api entrypoint runs `alembic upgrade head` on boot, so schema
      # migrations are applied automatically as part of the deploy.
      - name: Deploy to Dokploy
        env:
          DOKPLOY_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          COMPOSE_ID: ${{ secrets.DOGRAH_COMPOSE_ID }}
          SHA_TAG: ghcr.io/0repeat-lab/dograh-api:${{ github.sha }}
        run: |
          set -e
          CUR=$(curl -fsS -H "x-api-key: $DOKPLOY_KEY" -G "https://vps.0repeat.com/api/compose.one" --data-urlencode "composeId=$COMPOSE_ID" | jq -r .composeFile)
          NEW=$(printf '%s\n' "$CUR" | sed -E "s#image: dograh-api:custom#image: $SHA_TAG#")
          if ! grep -q "$SHA_TAG" <<<"$NEW"; then
            echo "ERROR: api image line not found in compose" >&2
            exit 1
          fi
          PAYLOAD=$(jq -nc --arg id "$COMPOSE_ID" --arg f "$NEW" '{composeId:$id,composeFile:$f}')
          curl -fsS -X POST "https://vps.0repeat.com/api/compose.update" -H "x-api-key: $DOKPLOY_KEY" -H "Content-Type: application/json" -d "$PAYLOAD" >/dev/null
          curl -fsS -X POST "https://vps.0repeat.com/api/compose.deploy" -H "x-api-key: $DOKPLOY_KEY" -H "Content-Type: application/json" -d "{\"composeId\":\"$COMPOSE_ID\",\"title\":\"API deploy $GITHUB_SHA\"}"
          echo "Deployed $SHA_TAG"
