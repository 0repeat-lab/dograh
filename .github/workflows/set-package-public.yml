name: Set GHCR package public
on:
  workflow_dispatch:
permissions:
  packages: write
  contents: read
jobs:
  pub:
    runs-on: ubuntu-latest
    steps:
      - name: Set visibility public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -x
          gh api --method PATCH /user/packages/container/dograh-ui -f visibility=public && echo "PATCH_OK"
          gh api /user/packages/container/dograh-ui --jq '.visibility'
